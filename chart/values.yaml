namespace: asylguiden

frontend:
  replicaCount: 1
  image:
    repository: ghcr.io/goodtribes-org/asylguiden.se/frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 3000
  # Non-secret configuration only. Every key listed here is rendered as an
  # explicit `env` entry on the container, and an explicit `env` entry WINS over
  # `envFrom` — so naming a secret here silently masks the real value in
  # asylguiden-secret. Secrets are seeded by scripts/create-secrets.sh and reach
  # the pod through envFrom alone. They must never appear in this file:
  # values.yaml is rendered by `helm template` into a manifest committed to the
  # goodtribes-org/deploy repo, so anything set here is published to git.
  #
  # Supplied via envFrom: STRAPI_API_TOKEN, NEXTAUTH_SECRET.
  env:
    NEXT_PUBLIC_STRAPI_URL: http://asylguiden-backend:1337
    # Same Meilisearch address as before, under a plain (non-NEXT_PUBLIC_) name
    # so it is read at runtime. NEXT_PUBLIC_* is inlined into the bundle at build
    # time, so the old NEXT_PUBLIC_MEILI_HOST was frozen to whatever the Docker
    # build saw — nothing — and this value never actually reached the code.
    # Only the server reads it; searches run in /api/search.
    MEILI_HOST: http://asylguiden-meilisearch:7700
    NEXTAUTH_URL: https://asylguiden.se

backend:
  replicaCount: 1
  image:
    repository: ghcr.io/goodtribes-org/asylguiden.se/backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    port: 1337
  # Non-secret configuration only — see the note on frontend.env above.
  #
  # Supplied via envFrom: APP_KEYS, API_TOKEN_SALT, ADMIN_JWT_SECRET,
  # TRANSFER_TOKEN_SALT, JWT_SECRET, ENCRYPTION_KEY, DATABASE_USERNAME,
  # DATABASE_PASSWORD, DATABASE_URL, MEILI_MASTER_KEY.
  env:
    HOST: "0.0.0.0"
    PORT: "1337"
    PUBLIC_URL: https://content.asylguiden.se
    DATABASE_CLIENT: postgres
    DATABASE_HOST: asylguiden-postgres
    DATABASE_PORT: "5432"
    DATABASE_NAME: asylguiden
    DATABASE_SSL: "false"
    MEILI_HOST: http://asylguiden-meilisearch:7700
    CORS_ORIGINS: https://asylguiden.se,https://www.asylguiden.se

postgres:
  replicaCount: 1
  image:
    repository: postgres
    tag: 16-alpine
    pullPolicy: IfNotPresent
  service:
    port: 5432
  env: {}
  persistence:
    size: 5Gi
    storageClass: ""

meilisearch:
  replicaCount: 1
  image:
    repository: getmeili/meilisearch
    tag: v1.6
    pullPolicy: IfNotPresent
  service:
    port: 7700
  env:
    MEILI_ENV: production
  persistence:
    size: 5Gi
    storageClass: ""

ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: http
    # Deliberately no acme.cert-manager.io/http01-edit-in-place. That annotation
    # makes cert-manager inject the /.well-known/acme-challenge path into this
    # Ingress, which ArgoCD (selfHeal + prune) reverts within seconds — the
    # challenge then 404s forever and no certificate is ever issued. Without it
    # cert-manager creates its own solver Ingress, which ArgoCD does not manage
    # and will not prune. The `http` ClusterIssuer already configures that solver
    # with ingressClassName traefik and the `web` entrypoint.
    kubernetes.io/ingress.class: traefik
    kubernetes.io/tls-acme: "true"
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,web
  hosts:
    - host: asylguiden.se
      service: asylguiden-frontend
      port: 3000
    - host: www.asylguiden.se
      service: asylguiden-frontend
      port: 3000
    # Strapi, reachable publicly so editors can use the admin UI without a
    # port-forward. Serves both /admin and the content API on this host.
    - host: content.asylguiden.se
      service: asylguiden-backend
      port: 1337
  tls:
    - secretName: asylguiden-tls
      hosts:
        - asylguiden.se
        - www.asylguiden.se
    # Deliberately a separate certificate from the apex. cert-manager reissues a
    # secret as a unit, so sharing one would let a failed HTTP01 challenge for the
    # new host take the working asylguiden.se certificate down with it.
    - secretName: asylguiden-cms-tls
      hosts:
        - content.asylguiden.se

collector:
  image:
    repository: ghcr.io/goodtribes-org/asylguiden.se/collector
    tag: latest
    pullPolicy: IfNotPresent
  # No strapiApiToken here: the CronJob reads COLLECTOR_STRAPI_API_TOKEN straight
  # from asylguiden-secret via secretKeyRef, so a value in this file would be
  # dead weight that leaks into the deploy repo.
  logLevel: info
  schedules:
    # Staggered every Monday UTC to avoid concurrent API calls
    scb: "0 6 * * 1"
    unhcr: "0 7 * * 1"
    eurostat: "0 8 * * 1"
    frontex: "0 9 * * 1"
    migrationsverket: "0 10 * * 1"
    migrationsverket-excel: "0 11 * * 1"
  # Collectors whose CronJob is created suspended.
  #
  # All six were suspended by hand in the cluster after every upstream broke,
  # and ArgoCD could not heal that back: the template never rendered `suspend`,
  # so there was no desired value to diff against and the manual change stuck
  # invisibly. lastSuccessfulTime was empty on every CronJob — not one had ever
  # produced an article. Declaring it here makes the intent explicit and lets
  # ArgoCD hold it.
  #
  # The two below stay suspended because neither can currently produce data,
  # and a weekly failing job is just noise that trains people to ignore alerts:
  #
  #   frontex          — points at a dataset-search API parsed as a CKAN
  #                      datastore, against the retired /euodp/ portal. Needs a
  #                      real source chosen before it can work at all.
  #   migrationsverket — Migrationsverket suspended asylum statistics from
  #                      2026-06-12 pending the EU migration pact rework, with
  #                      backfill "successively during autumn 2026" and no date.
  #                      Its scraped page 404s after a site restructure too.
  #
  # Unsuspend each one as its source is fixed, rather than all at once.
  suspended:
    - frontex
    - migrationsverket
    - migrationsverket-excel

imagePullSecrets:
  - name: ghcr-pull-secret
